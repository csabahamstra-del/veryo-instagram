<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Newsreader";src:url("fonts/newsreader.woff2") format("woff2");font-weight:200 800;font-style:normal}
@font-face{font-family:"Plus Jakarta Sans";src:url("fonts/jakarta.woff2") format("woff2");font-weight:200 800;font-style:normal}
:root{--sand:#F3EFE6;--paper:#FFFFFF;--ink:#0F1F1C;--ink-muted:#55635F;--line:#D9D2C3;--petrol:#1D4B44;--petrol-soft:#DDE8E4;--amber:#E0A03A;--amber-deep:#9A5B0B;
  --display:"Newsreader",Georgia,serif;--sans:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:#888}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:var(--sans);display:flex;flex-direction:column;padding:96px 96px 88px}
.slide.light{background:var(--sand);color:var(--ink)}
.slide.dark{background:var(--petrol);color:var(--paper)}
.eyebrow{font-size:26px;line-height:34px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.light .eyebrow{color:var(--petrol)}.dark .eyebrow{color:var(--petrol-soft)}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.title{font-family:var(--display);font-weight:500;letter-spacing:-.02em;margin:0;text-wrap:balance}
.cover .title{font-size:112px;line-height:1.04}
.point .title{font-size:76px;line-height:1.1}
.cta .title{font-size:96px;line-height:1.06}
.body{margin:40px 0 0;font-size:38px;line-height:1.45;max-width:860px}
.light .body{color:var(--ink-muted)}.dark .body{color:var(--petrol-soft)}
.num{font-family:var(--display);font-weight:500;font-size:220px;line-height:.9;color:var(--petrol);letter-spacing:-.03em;margin:0 0 32px}
.quote{border-left:0;background:var(--paper);border-radius:16px;padding:48px 56px;margin:0 0 44px;font-family:var(--display);font-weight:500;font-size:58px;line-height:1.18;color:var(--ink)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:48px}
.count{font-size:24px;font-weight:600;letter-spacing:.08em}
.light .count{color:var(--ink-muted)}.dark .count{color:var(--petrol-soft)}
.logo{height:64px;display:block}
.button{display:inline-flex;align-items:center;gap:20px;align-self:flex-start;background:var(--amber);color:var(--ink);font-weight:700;font-size:40px;line-height:1;padding:30px 44px;border-radius:10px;margin-top:56px}
.url{margin-top:28px;font-size:32px;color:var(--petrol-soft);letter-spacing:.02em}
.swipe{font-size:24px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--petrol-soft)}
.check{position:absolute;right:-40px;top:-30px;width:560px;height:560px;opacity:1}
.ticks{position:absolute;right:96px;top:96px;display:grid;grid-template-columns:repeat(3,40px);gap:24px}
</style></head>
<body><div id="root"></div>
<script>

const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function fit(el, min){
  const box = el.closest(".main");
  let size = parseFloat(getComputedStyle(el).fontSize);
  while(box.scrollHeight > box.clientHeight + 1 && size > min){ size -= 2; el.style.fontSize = size + "px"; }
}
window.renderSlide = function(s, i, n){
  const dark = s.type === "cover" || s.type === "cta";
  const counter = n > 1 ? `${i + 1}/${n}` : "";
  let inner = "";
  if(s.type === "cover"){
    inner = `<svg class="check" viewBox="0 0 200 200" aria-hidden="true"><polyline points="40,80 85,160 175,20" fill="none" stroke="#E0A03A" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity=".95"/></svg>
      <div class="eyebrow" style="position:relative">${esc(s.eyebrow || "")}</div>
      <div class="main"><h1 class="title">${esc(s.title)}</h1>${s.body ? `<p class="body">${esc(s.body)}</p>` : ""}</div>
      <div class="foot">${LOGO_DARK}<span class="swipe">${n > 1 ? "Swipe →" : ""}</span></div>`;
  } else if(s.type === "cta"){
    inner = `<div class="eyebrow">${esc(s.eyebrow || "Veryo · AI voor het MKB")}</div>
      <div class="main"><h1 class="title">${esc(s.title)}</h1>${s.body ? `<p class="body">${esc(s.body)}</p>` : ""}
        <span class="button">${esc(s.button || "Doe de gratis AI-scan")}</span><div class="url">${esc(s.url || "veryo.nl")}</div></div>
      <div class="foot">${LOGO_DARK}<span class="count">${counter}</span></div>`;
  } else {
    inner = `<div class="eyebrow">${esc(s.eyebrow || "")}</div>
      <div class="main">${s.num ? `<p class="num">${esc(s.num)}</p>` : ""}${s.quote ? `<p class="quote">“${esc(s.quote)}”</p>` : ""}
        <h2 class="title">${esc(s.title)}</h2>${s.body ? `<p class="body">${esc(s.body)}</p>` : ""}</div>
      <div class="foot"><span class="count">${counter}</span>${LOGO_LIGHT}</div>`;
  }
  const root = document.getElementById("root");
  root.innerHTML = `<div class="slide ${dark ? "dark" : "light"} ${s.type}" id="slide">${inner}</div>`;
  const t = root.querySelector(".title");
  if(t) fit(t, 44);
  const b = root.querySelector(".body");
  if(b){ let sz = 38; while(root.querySelector(".main").scrollHeight > root.querySelector(".main").clientHeight + 1 && sz > 26){ sz -= 2; b.style.fontSize = sz + "px"; } }
  return document.fonts.ready.then(() => true);
};
